################################################################

name: "Deploy Landing Zone Azure"

on:
  push:
    branches:
      - main
    paths:
      - 'landing-zone-caf/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Requis pour OIDC/WIF

jobs:
  deploy-governance:
    name: "Layer 00: Governance"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Azure Login via WIF"
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: "Terraform Apply"
        run: |
          cd landing-zone-caf/00-governance
          terraform init
          terraform apply -auto-approve

  deploy-connectivity:
    name: "Layer 01: Connectivity"
    needs: deploy-governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Azure Login via WIF"
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: "Terraform Apply"
        run: |
          cd landing-zone-caf/01-connectivity
          terraform init
          terraform apply -auto-approve

  # Les autres couches (02, 03) suivent la même logique de dépendance (needs)
